name: Docker Image Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Set build number
      id: build_number
      run: echo "build_number=b$(printf "%04d" ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

    - name: Build with docker-compose
      run: docker-compose build

    - name: Tag Docker images
      run: |
        docker tag streamlit-gpt-ui_streamlit-app ghcr.io/jimmyn0912/streamlit-gpt-ui/streamlit-app:latest
        docker tag streamlit-gpt-ui_streamlit-app ghcr.io/jimmyn0912/streamlit-gpt-ui/streamlit-app:${{ steps.build_number.outputs.build_number }}

        docker tag streamlit-gpt-ui_relay-server ghcr.io/jimmyn0912/streamlit-gpt-ui/relay-server:latest
        docker tag streamlit-gpt-ui_relay-server ghcr.io/jimmyn0912/streamlit-gpt-ui/relay-server:${{ steps.build_number.outputs.build_number }}

    - name: Push Docker Images
      run: |
        docker push ghcr.io/jimmyn0912/streamlit-gpt-ui/streamlit-app:latest
        docker push ghcr.io/jimmyn0912/streamlit-gpt-ui/streamlit-app:${{ steps.build_number.outputs.build_number }}

        docker push ghcr.io/jimmyn0912/streamlit-gpt-ui/relay-server:latest
        docker push ghcr.io/jimmyn0912/streamlit-gpt-ui/relay-server:${{ steps.build_number.outputs.build_number }}
